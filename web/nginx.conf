# S12: do not retain raw URI/query, host, referrer, user-agent or peer address.
map $request_method $mk_method {
  default OTHER;
  GET GET;
  HEAD HEAD;
  POST POST;
  PUT PUT;
  PATCH PATCH;
  DELETE DELETE;
  OPTIONS OPTIONS;
}
map $uri $mk_surface {
  default web;
  ~^/api/ api;
}
log_format mk_private 'http_request method=$mk_method surface=$mk_surface status=$status duration_s=$request_time';
access_log off;
# Nginx error records include the original request and cannot use log_format.
# HTTP failures stay observable through the content-free status log above.
# Configuration failures remain visible via nginx -t / container exit status.
error_log /dev/null;

server {
  access_log /dev/stdout mk_private;
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;            # required for SSE streaming
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
  }
  location / { try_files $uri /index.html; }
}
