name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - run: pip install --require-hashes -r requirements.txt
      - name: Image report gate refuses missing and substituted evidence
        working-directory: .
        run: python -m pytest tools/verification/test_image_security.py -q
      - name: pytest
        run: |
          set +e -o pipefail   # GitHub runs bash -e: keep going after the pipeline fails so diagnostics print
          python -m pytest -q -ra 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -40 | sed 's/^/::error title=pytest::/' || true
          grep -E "^E " pytest.log | head -40 | sed 's/^/::error title=assert::/' || true
          exit $rc
        env:
          MK_ALLOW_DEV_SECRETS: "1"

  web-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Locked web dependency vulnerability gate
        run: npm audit --audit-level=moderate
      - name: npm run build (tsc -b strict typecheck + vite production build)
        run: |
          set +e -o pipefail   # GitHub runs bash -e: keep going after the pipeline fails so diagnostics print
          npm run build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          grep -E "error TS|ERROR|Error:" build.log | head -40 | sed 's/^/::error title=web-build::/' || true
          exit $rc
      # WCAG 2.2 A/AA automated checks (axe-core) on every supported screen, plus the
      # approval-screen contract (H1 fields, explicit per-message passkey gesture).
      # Manual keyboard / screen-reader assessment is a separate human acceptance step.
      - run: npx playwright install --with-deps chromium
      - name: npm run test:a11y
        run: |
          set +e -o pipefail   # GitHub runs bash -e: keep going after the pipeline fails so diagnostics print
          npm run test:a11y 2>&1 | tee a11y.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            tail -60 a11y.log | sed 's/^/::error title=a11y-log::/'
            node -e '
              const fs=require("fs"); if(!fs.existsSync("test-results/a11y.json")) process.exit(0);
              const r=JSON.parse(fs.readFileSync("test-results/a11y.json","utf8"));
              const walk=s=>{(s.specs||[]).forEach(sp=>sp.tests.forEach(t=>t.results.filter(x=>x.status!=="passed").forEach(x=>console.log("::error title=a11y::"+sp.title+" :: "+(x.error&&x.error.message||x.status).replace(/\n/g," ").slice(0,400)))));(s.suites||[]).forEach(walk)};
              r.suites.forEach(walk);' || true
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-a11y-results, path: web/test-results/a11y.json, if-no-files-found: ignore }

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build application image with recorded official RDS trust bundle
        run: |
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /tmp/app-rds-ca.pem
          digest=$(sha256sum /tmp/app-rds-ca.pem | cut -d' ' -f1)
          echo "RDS CA SHA256: $digest"
          docker build --build-arg RDS_CA_BUNDLE_SHA256="$digest" -t mk-harness-api ./backend
      - run: docker build -t mk-harness-web -f web/Dockerfile .
      - name: Actual web proxy request and failure privacy
        run: python3 tools/verification/web_privacy_image.py --image mk-harness-web --output web-proxy-privacy
      - name: Scan application runtime and retain CycloneDX inventory
        run: python3 tools/verification/image_security.py --image mk-harness-api --cache "$RUNNER_TEMP/trivy" --output image-security/app
      - name: Scan web runtime and retain CycloneDX inventory
        if: success() || failure()
        run: python3 tools/verification/image_security.py --image mk-harness-web --cache "$RUNNER_TEMP/trivy" --output image-security/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: app-web-image-security
          path: image-security
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-proxy-privacy
          path: web-proxy-privacy

  app-postgres-boundary:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-app-test-only
          POSTGRES_DB: mk_app_test_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mk_app_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt
      - name: Actual runtime role, migration, retained-data upgrade and MFA transactions
        run: python -m pytest tools/verification/test_app_database.py tools/verification/test_app_privacy.py -q --tb=short --junitxml=app-postgres.xml
        env:
          MK_APP_TEST_ADMIN_URL: postgresql+psycopg://postgres:isolated-ci-app-test-only@127.0.0.1:5432/mk_app_test_admin
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, pinned Rust compiler
        with: {toolchain: "1.97.0"}
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with: {workspaces: rust, key: privacy-bridge}
      - name: Build actual kernel for cross-service erasure acceptance
        run: cargo build --locked --manifest-path rust/Cargo.toml --bin mk-action-api --bin mk-action-worker --bin mk-restore-gate --bin mk-privacy-ledger
      - name: Real application-runtime to kernel-runtime erasure and identity formats
        run: python -m pytest tools/verification/test_privacy_bridge.py tools/verification/test_privacy_process.py tools/verification/test_kernel_privacy_restore.py tools/verification/test_kernel_audit_privacy.py -q --tb=short --junitxml=privacy-bridge.xml
        env:
          MK_APP_TEST_ADMIN_URL: postgresql+psycopg://postgres:isolated-ci-app-test-only@127.0.0.1:5432/mk_app_test_admin
          MK_PRIVACY_KERNEL_BINARY: rust/target/debug/mk-action-api
          MK_PRIVACY_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-postgres-boundary
          path: |
            app-postgres.xml
            privacy-bridge.xml
