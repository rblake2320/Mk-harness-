name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: test-postgres-password
          POSTGRES_DB: mkharness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mk -d mkharness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - run: pip install -r requirements.txt
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://mk:test-postgres-password@localhost:5432/mkharness_test
      - run: python -m pytest -v
        env:
          MK_ALLOW_DEV_SECRETS: "1"

  web-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build   # tsc -b strict typecheck + vite production build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, web-build]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: docker build -t mk-harness-api ./backend
      - run: docker run --rm --entrypoint python mk-harness-api -c "from app.agent_ops.contracts import validator; validator('work_order')"
      - run: docker build -t mk-harness-web -f web/Dockerfile .
