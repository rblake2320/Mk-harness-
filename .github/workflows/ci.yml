name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
        env:
          MK_ALLOW_DEV_SECRETS: "1"

  web-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build   # tsc -b strict typecheck + vite production build
      # WCAG 2.2 A/AA automated checks (axe-core) on every supported screen, plus the
      # approval-screen contract (H1 fields, explicit per-message passkey gesture).
      # Manual keyboard / screen-reader assessment is a separate human acceptance step.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-a11y-results, path: web/test-results/a11y.json, if-no-files-found: ignore }

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mk-harness-api ./backend
      - run: docker build -t mk-harness-web -f web/Dockerfile .
