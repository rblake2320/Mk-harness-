name: Rust action kernel

on:
  push:
    branches: [main]
    paths: ["rust/**", "contracts/**", "migrations/**", "deploy/kernel/**", "evidence/**", "scripts/**", "tools/**", "backend/app/kernel/**", "backend/app/routes/agent_ops.py", "docker-compose.kernel.yml", ".github/workflows/kernel-ci.yml"]
  pull_request:
    paths: ["rust/**", "contracts/**", "migrations/**", "deploy/kernel/**", "evidence/**", "scripts/**", "tools/**", "backend/app/kernel/**", "backend/app/routes/agent_ops.py", "docker-compose.kernel.yml", ".github/workflows/kernel-ci.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rust } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: kernel, POSTGRES_DB: mk_kernel_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Actions pinned by immutable commit digest (same pins as ci.yml on the governed branch).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-10)
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit,cargo-cyclonedx
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --no-fail-fast
        env:
          MK_TEST_DATABASE_URL: postgres://postgres:kernel@127.0.0.1:5432/mk_kernel_test
          MK_TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: cargo test --doc --workspace
      - run: cargo deny check
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0381  # sqlx-mysql never compiled; see deny.toml
      - name: SBOM
        run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-sbom
          path: rust/**/*.cdx.json
          if-no-files-found: error

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - run: pip install jsonschema==4.23.0
      - name: JSON Schema fixtures + cross-language HMAC vectors (Python side)
        run: python -I contracts/tests/test_contracts.py
      - name: Real-device agent suite (stdlib, no device)
        run: python -m unittest -v
        working-directory: tools/mobile-agent-adb
      - run: pip install pyyaml==6.0.2
      - name: Evidence records validate (schema + checksums)
        run: python -I tools/evidence/check.py

  # End-to-end through the application: real binaries, Postgres, Redis, FastAPI,
  # the device agent in dry-run, per-process DB logins, and the production
  # pre-flight. This is the gate that found the kill-switch bypass, the wire-name
  # mismatch and the role-vocabulary mismatch that unit tests could not see.
  live-smoke:
    runs-on: ubuntu-latest
    needs: [kernel]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: kernel, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-10)
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust
          key: live-smoke-release
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pyyaml
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools
      - name: Live smoke (8 gates) + production pre-flight
        env:
          PGURL: postgres://postgres:kernel@127.0.0.1:5432/mk_kernel_smoke
          REDIS_URL: redis://127.0.0.1:6379
          RUSTFLAGS: ""
        run: WORK="$RUNNER_TEMP/smoke" bash scripts/kernel-live-smoke.sh
      - name: Keep smoke artifacts (logs, agent evidence chain, pre-flight report)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-smoke
          path: ${{ runner.temp }}/smoke/*.log
          if-no-files-found: ignore

  kernel-image:
    runs-on: ubuntu-latest
    needs: [kernel, contracts]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: docker build -f deploy/kernel/Dockerfile -t mk-action-kernel:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mk-action-kernel:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
