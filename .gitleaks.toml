# Secret scanning configuration (contract S8). Extends the default ruleset.
# Allowlisted paths are test fixtures that contain *shape-valid, value-fake*
# material by design (published Twilio signature vector, software authenticator
# fixtures, dev key generator output in test logs). Nothing under backend/app,
# rust/crates/*/src (non-test), deploy/, infra/ may ever be allowlisted.
[extend]
useDefault = true

[allowlist]
description = "test fixtures with fake credentials"
# Regexes below match the whole finding line (the fake SIDs/placeholders are
# substrings of it either way; the GPG_KEY rule needs the ENV context).
regexTarget = "line"
paths = [
  '''rust/crates/mk-adapters/src/twilio\.rs''',           # published Twilio signature test vector
  '''rust/crates/mk-crypto/src/webauthn\.rs''',           # softauthn test fixtures
  '''rust/crates/[a-z-]+/tests/.*''',
  '''backend/tests/.*''',
  '''contracts/tests/.*''',
  '''web/tests/.*''',
  '''tools/mobile-agent-adb/test_.*\.py''',
]
regexes = [
  '''ACaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa''',   # smoke account SID (fake)
  '''ACbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb''',   # e2e account SID (fake)
  '''ACcccccccccccccccccccccccccccccccc''',   # load account SID (fake)
  '''dev-secret-dev-secret-dev-secret-123''', # MK_ALLOW_DEV_SECRETS placeholder
  # Public OpenPGP key fingerprints from base-image layer history (python:3.x images
  # set GPG_KEY to the release manager's PUBLIC key id). Image-scan reports quote
  # them; they are not secrets. Scoped to the exact Dockerfile ENV shape.
  '''ENV GPG_KEY=[0-9A-F]{40}''',
]
