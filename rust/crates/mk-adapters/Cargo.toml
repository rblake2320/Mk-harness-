[package]
name = "mk-adapters"
description = "Typed outbound adapters behind a sealed trait: mobile work-order adapter (HMAC-signed, egress-allowlisted), internal CRM/calendar stubs, and the contract simulator. No generic HTTP/SQL/shell adapter exists."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mk-domain = { workspace = true }
mk-crypto = { workspace = true }
mk-contracts = { workspace = true }
mk-queue = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
secrecy = { workspace = true }
anyhow = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }

[dev-dependencies]
mk-testkit = { workspace = true }

[[bin]]
name = "mk-simulator"
path = "src/bin/simulator.rs"

[[bin]]
name = "mk-twilio-sim"
path = "src/bin/twilio_sim.rs"
