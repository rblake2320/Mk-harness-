[package]
name = "mk-mcp"
description = "Constrained MCP server over the kernel API: five read/propose tools, pinned tool manifest, no approval or adapter tools. Built on the official rmcp SDK."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "mk-mcp-server"
path = "src/bin/server.rs"

[dependencies]
mk-domain = { workspace = true }
mk-crypto = { workspace = true }
mk-contracts = { workspace = true }
rmcp = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
rmcp = { version = "3", features = ["server", "client", "transport-io", "transport-async-rw"] }
