[package]
name = "mk-worker"
description = "Queue consumer: lease, dispatch-time recheck, atomic approval consumption, idempotent adapter execution, retry/dead-letter, housekeeping (expiry, lease recovery, nonce purge)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "mk-action-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "mk-outbox-relay"
path = "src/bin/relay.rs"

[[bin]]
name = "mk-audit-verifier"
path = "src/bin/verifier.rs"

[dependencies]
mk-domain = { workspace = true }
mk-crypto = { workspace = true }
mk-contracts = { workspace = true }
mk-policy = { workspace = true }
mk-audit = { workspace = true }
mk-store = { workspace = true }
mk-queue = { workspace = true }
mk-adapters = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
mk-testkit = { workspace = true }
sqlx = { workspace = true }
