[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # rsa 0.9 Marvin attack: a timing side channel in RSA *private-key* operations
  # (decryption / signing). `rsa` is compiled into mk-crypto solely to VERIFY
  # WebAuthn RS256 assertions with a public key (webauthn.rs: RsaPublicKey::verify);
  # the kernel holds no RSA private key and performs no RSA decryption or signing,
  # so the vulnerable code path is unreachable. No fixed rsa release exists.
  # Re-check with `rg 'rsa::' crates` whenever mk-crypto changes.
  { id = "RUSTSEC-2023-0071", reason = "rsa used for public-key signature verification only (WebAuthn RS256); no private-key operations" },
]

[licenses]
version = 2
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "Unicode-DFS-2016", "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Workspace crates are proprietary and unpublished.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "rustls only" },
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
