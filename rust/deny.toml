[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # rsa 0.9 Marvin timing attack. `rsa` is reachable only through sqlx-mysql,
  # which is never enabled (postgres-only feature set) and is not compiled;
  # it appears in Cargo.lock because lockfiles are feature-independent.
  # Verified with `cargo tree -i rsa` (nothing to print).
  { id = "RUSTSEC-2023-0071", reason = "unused optional dependency (sqlx-mysql) never compiled" },
  # webpki-roots 0.26 (distrusted emSign intermediates still bundled). Pulled only by
  # sqlx-core 0.8's `tls-rustls` feature; the fixed line (1.0.10) requires sqlx 0.9, a
  # major upgrade tracked for WP09 follow-up. Mitigation in force: production database
  # URLs are composed with `sslmode=verify-full&sslrootcert=<RDS CA bundle>`
  # (MK_DB_SSLROOTCERT, mk_store::database_url_from_env) — when a root cert path is given,
  # sqlx-core builds the rustls root store from that file alone and never consults the
  # bundled webpki roots. reqwest (provider egress) uses webpki-roots 1.0.10.
  { id = "RUSTSEC-2026-0381", reason = "sqlx-core 0.8 pin; production uses an explicit RDS root cert so the bundled roots are not consulted" },
]

[licenses]
version = 2
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "Unicode-DFS-2016", "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Workspace crates are proprietary and unpublished.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "rustls only" },
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
